services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER:-sync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-syncaura}
      POSTGRES_DB: ${DB_NAME:-syncaura}
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${DB_USER:-sync} -d ${DB_NAME:-syncaura}' ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:

